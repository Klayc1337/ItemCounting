<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание накладной</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:if="${invoice.type == 'ARRIVAL'}">Новая приходная накладная</h1>
    <h1 th:if="${invoice.type == 'SHIPMENT'}">Новая расходная накладная</h1>
    <form th:action="${invoice.type == 'ARRIVAL'} ? @{/invoices/arrival/new} : @{/invoices/shipment/new}" method="post">
        <!-- скрытые поля для type и status -->
        <input type="hidden" th:field="*{invoice.type}">
        <input type="hidden" th:field="*{invoice.status}">

        <div class="form-group">
            <label>Комментарий:</label>
            <textarea th:field="*{invoice.comment}" rows="3" cols="50"></textarea>
        </div>

        <h3>Товары в накладной</h3>
        <div th:each="item, iter : ${invoice.items}">
            <div style="border:1px solid #ccc; padding:10px; margin:10px 0;">
                <input type="hidden" th:field="*{invoice.items[__${iter.index}__].id}" />
                <div class="form-group">
                    <label>Товар:</label>
                    <select th:field="*{invoice.items[__${iter.index}__].productId}">
                        <option value="">-- Выберите товар --</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' (' + p.sku + ')'}">Товар</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Количество:</label>
                    <input type="number" step="0.001" th:field="*{invoice.items[__${iter.index}__].quantity}" />
                </div>
                <div class="form-group" th:if="${invoice.type == 'ARRIVAL'}">
                    <label>Цена:</label>
                    <input type="number" step="0.01" th:field="*{invoice.items[__${iter.index}__].price}" />
                </div>
            </div>
        </div>

        <button type="submit" class="button-success">Сохранить накладную</button>
        <a th:href="${invoice.type == 'ARRIVAL'} ? @{/invoices/arrival} : @{/invoices/shipment}">Отмена</a>
    </form>
</div>
</body>
</html>
