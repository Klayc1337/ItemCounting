<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Накладные</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:if="${type == 'ARRIVAL'}">Приходные накладные</h1>
    <h1 th:if="${type == 'SHIPMENT'}">Расходные накладные</h1>
    <div class="nav">
        <a th:href="@{/}">Главная</a>
        <a th:if="${type == 'ARRIVAL'}" th:href="@{/invoices/arrival/new}">Создать приход</a>
        <a th:if="${type == 'SHIPMENT'}" th:href="@{/invoices/shipment/new}">Создать расход</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Статус</th>
            <th>Сумма</th>
            <th>Дата</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inv : ${invoices}">
            <td th:text="${inv.id}">1</td>
            <td th:text="${inv.status}">DRAFT</td>
            <td th:text="${inv.totalAmount}">0.00</td>
            <td th:text="${inv.createdAt}">2025-01-01</td>
            <td>
                <a th:href="@{/invoices/{id}(id=${inv.id})}">Просмотр</a>
                <form th:if="${inv.status.name() == 'DRAFT' || inv.status == 'COMPLETED'}" th:action="@{/invoices/{id}/cancel(id=${inv.id})}" method="post" style="display:inline;">
                    <button type="submit" class="button-danger">Отменить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
