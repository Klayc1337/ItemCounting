<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма товара</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1 th:if="${action == 'create'}">Новый товар</h1>
    <h1 th:if="${action == 'edit'}">Редактирование товара</h1>
    <form th:action="@{${action == 'create' ? '/products/new' : '/products/edit/{id}(id=${product.id})'}}" method="post">
        <div class="form-group">
            <label>Название:</label>
            <input type="text" th:field="*{product.name}" required>
        </div>
        <div class="form-group">
            <label>Артикул:</label>
            <input type="text" th:field="*{product.sku}" required>
        </div>
        <div class="form-group">
            <label>Единица измерения:</label>
            <input type="text" th:field="*{product.unit}" required>
        </div>
        <button type="submit" class="button-success">Сохранить</button>
        <a th:href="@{/products}">Отмена</a>
    </form>
</div>
</body>
</html>
