<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Остатки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Текущие остатки на складе</h1>
    <div class="nav">
        <a th:href="@{/}">Главная</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Товар</th>
            <th>Артикул</th>
            <th>Остаток</th>
            <th>Обновлён</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${stocks}">
            <td th:text="${s.productName}">Мыло</td>
            <td th:text="${s.productSku}">SOAP-001</td>
            <td th:text="${s.quantity}">100</td>
            <td th:text="${s.updatedAt}">2025-01-01</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
