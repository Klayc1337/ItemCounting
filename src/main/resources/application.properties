spring.application.name=ItemCounting
server.port=8080
management.endpoint.health.show-details=always

jwt.secret=hngjkfjgjnOFGJRmnbvko34875dfgKNFGfjhgjhs
jwt.expiration=3600000

spring.datasource.url=jdbc:postgresql://localhost:5432/itemCounting
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
logging.level.liquibase=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

spring.kafka.bootstrap-servers=localhost:8083
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
replenishment.request-topic=replenishment-requests
replenishment.reply-topic=replenishment-replies
replenishment.request-time=10000

